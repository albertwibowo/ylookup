[project]
name = "ylookup"
version = "0.1.0"
description = "DIU CLI workflow builder for capital-call bank matching"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "openpyxl>=3.1.5",
    "openrouter>=1.3.52",
    "pdfplumber>=0.11.10",
    "pydantic>=2.0",
]

[project.scripts]
ylookup = "ylookup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ylookup"]
